name: Refresh orbit data

on:
  schedule:
    - cron: "17 3 * * *" # every day, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Download fresh CelesTrak data
        run: python backend/refresh_data.py
      - name: Rebuild the first-screen demo
        run: python backend/make_demo.py
      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "orbit-refresh[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add backend/data public/demo.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Refresh orbit snapshot $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Send the new data to the Hugging Face Space
        if: steps.commit.outputs.changed == 'true' && env.HF_TOKEN != ''
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          for name in ("active.txt", "debris.txt"):
              api.upload_file(
                  path_or_fileobj=f"backend/data/{name}",
                  path_in_repo=f"projects/spacedebris/data/{name}",
                  repo_id="totz07/wafer-defect-api",
                  repo_type="space",
                  commit_message="Refresh orbit snapshot",
              )
          PY
